name: cinemax-laravel-template

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    command: app
    env_file: ../.env
    ports:
      - "8000:8000"
    volumes:
      - ..:/app
      - vendor:/app/vendor
    depends_on:
      - db

  vite:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    command: vite
    ports:
      - "5173:5173"
    volumes:
      - ..:/app
      - node_modules:/app/node_modules

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-cinemax}
      MYSQL_DATABASE: ${DB_DATABASE:-cinemax}
      MYSQL_USER: ${DB_USERNAME:-cinemax}
      MYSQL_PASSWORD: ${DB_PASSWORD:-cinemax}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  vendor:
  node_modules:
  db_data:
